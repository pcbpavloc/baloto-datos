name: Actualizar datos Baloto

on:
  schedule:
    # Lunes (1), Miércoles (3) y Sábado (6) a las 04:15 AM UTC 
    # (Equivalente a 11:15 PM hora Colombia, 15 min después del sorteo)
    - cron: '45 4 * * 1,3,6'
  workflow_dispatch: # Permite ejecutarlo manualmente si es necesario

# Dar permiso de escritura al robot para hacer push de los cambios
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Mantiene el token para poder hacer push
          
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 pandas
          
      - name: Ejecutar script de actualización
        run: python scripts/actualizar.py
        
      - name: Guardar cambios
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "bot@baloto-datos.com"
          git add baloto_era_actual.csv
          # Solo hace commit si hay cambios reales en el archivo
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Actualización automática $(date)"
          git push
