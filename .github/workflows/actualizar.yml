name: Actualizar datos Baloto

on:
  schedule:
    # Miércoles y sábados a las 11:00 PM hora Colombia (4:00 AM UTC del día siguiente)
    - cron: '0 4 * * 4,0'
  workflow_dispatch:

# ✅ ESTA SECCIÓN ES LA QUE FALTABA: da permiso de escritura al robot
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          # ✅ Importante: mantener el token para poder hacer push después
          persist-credentials: true
          
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 pandas
          
      - name: Ejecutar script de actualización
        run: python scripts/actualizar.py
        
      - name: Guardar cambios
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "bot@baloto-datos.com"
          git add baloto_era_actual.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Actualización automática $(date)"
          git push
